<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ohmycontext</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #222; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .tabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
      .tabs button { border: none; background: none; padding: 4px 10px; font: inherit; cursor: pointer; color: #666; border-radius: 6px; }
      .tabs button.active { background: #eef2ff; color: #1a1a7f; font-weight: 600; }
      .row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #aaa; flex: none; }
      .dot.ok { background: #1a7f37; }
      .dot.err { background: #cf222e; }
      label { flex: 1; color: #555; }
      input[type='text'] { width: 100%; box-sizing: border-box; padding: 4px 6px; font: inherit; }
      button.act { padding: 4px 10px; font: inherit; cursor: pointer; }
      .muted { color: #777; font-size: 12px; }
      #captureResult { font-size: 12px; color: #555; }
      .site { border: 1px solid #e3e3e3; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
      .site h2 { font-size: 12px; margin: 0 0 6px; }
      .site .reqs { font: 10.5px/1.5 ui-monospace, monospace; color: #666; max-height: 140px; overflow-y: auto; word-break: break-all; }
      .site .reqs div { border-bottom: 1px dotted #eee; }
      .site .kind { font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
      #copyDiag { width: 100%; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>ohmycontext</h1>
    <div class="tabs">
      <button id="tabStatus" class="active">Status</button>
      <button id="tabDiag">Diagnostics</button>
    </div>
    <div id="pageStatus">
      <div class="row"><span id="statusDot" class="dot"></span><span id="statusText" class="muted">checking…</span></div>
      <div class="row"><label>events sent</label><span id="sent">0</span></div>
      <div class="row"><label>queued</label><span id="queued">0</span></div>
      <div class="row"><label>last delivery</label><span id="lastDelivery" class="muted">—</span></div>
      <div class="row"><label for="daemonUrl">daemon</label></div>
      <div class="row"><input id="daemonUrl" type="text" spellcheck="false" /></div>
      <div class="row"><label for="enabled">capture enabled</label><input id="enabled" type="checkbox" /></div>
      <div class="row"><button class="act" id="save">save</button><button class="act" id="captureNow">capture this tab</button></div>
      <div class="row"><span id="captureResult"></span></div>
    </div>
    <div id="pageDiag" hidden>
      <div id="diagSites"></div>
      <button class="act" id="copyDiag">copy diagnostics</button>
      <div class="muted" id="copyState"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
